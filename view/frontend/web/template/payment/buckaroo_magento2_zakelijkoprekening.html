<div class="buckaroo_magento2_zakelijkoprekening payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice bk-payment">
        <div class="bk-payment-wrap">
            <div class="bk-radio-wrap">
                <input type="radio"
                       name="payment[method]"
                       class="radio"
                       data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()">
                <label class="label bk-zakelijk-label" data-bind="attr: {'for': getCode()}">
                    <span class="bk-zakelijk-title" data-bind="text: getTitle()"></span>
                    <!-- ko if: buckaroo.display_subtext && buckaroo.subtext !== null && buckaroo.subtext.length > 0 -->
                    <span class="bk-zakelijk-subtext" data-bind="text: ' - ' + buckaroo.subtext, style: getSubtextStyle()"></span>
                    <!-- /ko -->
                    <span class="buckaroo-cvc-tooltip-wrapper bk-zakelijk-tooltip-wrap">
                        <button type="button"
                                class="buckaroo-cvc-tooltip-button"
                                data-bind="click: toggleTooltip, attr: {'aria-label': $t('More information')}"
                                tabindex="-1">
                            <svg class="buckaroo-tooltip-icon" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"></path>
                            </svg>
                        </button>
                        <div class="buckaroo-cvc-tooltip bk-zakelijk-tooltip" data-bind="visible: showTooltip">
                            <span data-bind="text: getTooltipText()"></span>
                            <a data-bind="attr: { href: getTooltipUrl() }, i18n: 'lees meer.'"
                               target="_blank"
                               rel="noopener noreferrer"></a>
                            <div class="buckaroo-tooltip-arrow"></div>
                        </div>
                    </span>
                </label>
            </div>
            <div class="bk-mode-and-img">
                <!-- ko if: buckaroo.isTestMode -->
                <div class="bk-test-mode"><div class="bk-test-text" data-bind="i18n: 'Test Mode'"></div></div>
                <!-- /ko -->
                <div class="bk-img-wrap">
                    <img
                        data-bind="attr: { src: buckaroo.logo }"
                        alt="Zakelijk op rekening"
                    />
                </div>
            </div>
        </div>
    </div>

    <div class="payment-method-content">

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="payment-method-second-col billing-address-form">
            <form data-bind="mageInit: { 'validation': [] },
                  attr: {'data-hasrequired': $t('* Required Fields')}">
                <fieldset class="fieldset payment">
                    <legend class="hidden-fieldset-legend">Payment Details</legend>
                    <div class="field required">
                        <label class="label" for="buckaroo_magento2_zakelijkoprekening_BillingName">
                            <span data-bind="i18n: 'Billing Name:'"></span>
                        </label>
                        <div class="control">
                            <input id="buckaroo_magento2_zakelijkoprekening_BillingName"
                                   class="input-text field"
                                   type="text"
                                   data-bind="value: billingName"
                                   name="payment[buckaroo_magento2_zakelijkoprekening][customer_billingName]"
                                   disabled>
                        </div>
                    </div>

                    <!-- ko if: showPhone -->
                    <div class="field required">
                        <label class="label" for="buckaroo_magento2_zakelijkoprekening_Telephone">
                            <span data-bind="i18n: 'Telephone:'"></span>
                        </label>
                        <div class="control">
                            <input id="buckaroo_magento2_zakelijkoprekening_Telephone"
                                   type="text"
                                   class="input-text field"
                                   data-bind="
                                   valueUpdate: 'blur',
                                   value: phone,
                                   event: { blur: validateField }"
                                   data-validate="{required: true, 'zakelijkOpRekeningPhoneValidation': true}"
                                   name="payment[buckaroo_magento2_zakelijkoprekening][customer_telephone]">
                        </div>
                    </div>
                    <!-- /ko -->

                    <div class="field required">
                        <label class="label" for="buckaroo_magento2_zakelijkoprekening_chamberOfCommerce">
                            <span data-bind="i18n: 'COC Number:'"></span>
                        </label>
                        <div class="control">
                            <input id="buckaroo_magento2_zakelijkoprekening_chamberOfCommerce"
                                   class="input-text field"
                                   type="text"
                                   data-bind="
                                   valueUpdate: 'blur',
                                   value: cocNumber,
                                   event: { blur: validateField }"
                                   data-validate="{required: true}"
                                   name="payment[buckaroo_magento2_zakelijkoprekening][customer_chamberOfCommerce]">
                        </div>
                    </div>

                    <div class="field">
                        <span data-bind="i18n: 'Please make sure all fields are filled in correctly before proceeding.'"></span>
                    </div>
                </fieldset>
            </form>
        </div>

        <div class="actions-toolbar">
            <div class="primary">
                <button id="button-action-checkout-zakelijkoprekening"
                        class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        enable: (getCode() == isChecked()),
                        css: {disabled: !isPlaceOrderActionAllowed() }
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>

        <!-- ko if: payWithBaseCurrency() -->
        <div class="buckaroo_magento2_currency-notification">
            <span data-bind="text: getPayWithBaseCurrencyText()"></span>
        </div>
        <!--/ko-->

        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

    </div>
</div>
